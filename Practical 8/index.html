<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">

        <h2>Gym Admission Form</h2>
        <p class="subtitle">Registration Form</p>

        <form id="gymForm">

            <table>

                <tr>
                    <th>Name</th>
                    <th>Value</th>
                </tr>

                <tr>
                    <td>Name</td>
                    <td>
                        <input type="text" id="name">
                        <span id="nameError"></span>
                    </td>
                </tr>

                <tr>
                    <td>Sex</td>
                    <td>
                        <label>
                            <input type="radio" name="sex" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="sex" value="Female">
                            Female
                        </label>

                        <span id="sexError"></span>
                    </td>
                </tr>

                <tr>
                    <td>Eye color</td>
                    <td>
                        <select id="eyeColor">
                            <option value="">Select</option>
                            <option value="Green">Green</option>
                            <option value="Blue">Blue</option>
                            <option value="Brown">Brown</option>
                            <option value="Black">Black</option>
                        </select>

                        <span id="eyeError"></span>
                    </td>
                </tr>

                <tr>
                    <td>Check all that apply</td>
                    <td>
                        <label>
                            <input type="checkbox" name="fitness" value="Over 6 feet tall">
                            Over 6 feet tall
                        </label>

                        <label>
                            <input type="checkbox" name="fitness" value="Over 200 pounds">
                            Over 200 pounds
                        </label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="description">
                        Describe your athletic ability:
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="textarea-cell">
                        <textarea id="ability"></textarea>
                        <span id="abilityError"></span>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="button-cell">
                        <button type="submit">Enter my information</button>
                    </td>
                </tr>

            </table>

        </form>

        <div id="result"></div>

        <footer>
            Designed By: <span>Rudrakshi Bhandekar</span> |
            PRN: <span>24070521012</span>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
